# Builds native binaries on each OS (Fyne needs cgo, so no cross-compiling)
# and attaches them to the GitHub release for a tag (v1.2.3).
#
# Two ways to release:
#   - push a tag:  git tag -a v2.0.0 -m "..." && git push origin v2.0.0
#   - or run this workflow manually with the version; it creates the tag on
#     the chosen ref first, then builds.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag
        run: |
          set -e
          TAG="v${{ inputs.version }}"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"; exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "$TAG" -m "FM NewGen Faces ${{ inputs.version }}"
          git push origin "$TAG"

  build:
    needs: [tag]
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            archive: tar.gz
          - os: windows-latest
            goos: windows
            archive: zip
          - os: macos-latest
            goos: darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libgtk-3-dev
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          LD="-s -w -X fmnewgenfaces/internal/brand.Version=${{ steps.v.outputs.version }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # GUI binary without a console window, plus a console build for the CLI.
            go build -trimpath -ldflags "$LD -H windowsgui" -o fm-newgen-faces.exe .
            go build -trimpath -ldflags "$LD" -o fm-newgen-faces-cli.exe .
          else
            go build -trimpath -ldflags "$LD" -o fm-newgen-faces .
          fi
      - name: Package
        shell: bash
        run: |
          NAME=fm-newgen-faces-${{ matrix.goos }}-${{ steps.v.outputs.version }}
          mkdir -p dist/$NAME
          cp README.md LICENSE dist/$NAME/
          # Versioned archive plus an unversioned copy, so the website can
          # link to releases/latest/download/fm-newgen-faces-<os>.<ext>.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp fm-newgen-faces.exe fm-newgen-faces-cli.exe dist/$NAME/
            (cd dist && 7z a -tzip $NAME.zip $NAME >/dev/null && cp $NAME.zip fm-newgen-faces-windows.zip)
          else
            cp fm-newgen-faces dist/$NAME/
            (cd dist && tar -czf $NAME.tar.gz $NAME && cp $NAME.tar.gz fm-newgen-faces-${{ matrix.goos }}.tar.gz)
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: FM NewGen Faces ${{ steps.v.outputs.version }}
          files: |
            dist/*-${{ steps.v.outputs.version }}.${{ matrix.archive }}
            dist/fm-newgen-faces-${{ matrix.goos }}.${{ matrix.archive }}
          generate_release_notes: true
